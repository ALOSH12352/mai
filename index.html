<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيد ميلاد مي</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">

</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main lang="ar" dir="rtl">
  <h1 id="title">كل سنة وإنتي طيبة يا أستاذة مي</h1>
  <p class="lead" id="lead">دي هدية صغيرة من أخوكي الصغير. إنفخي الشموع الأول، وبعدين افتحي الكروت.</p>

  <div class="stage">
    <svg viewBox="0 0 320 290" role="img" aria-label="تورتة عيد ميلاد عليها خمس شموع">
      <ellipse cx="160" cy="262" rx="150" ry="14" fill="#120b22"/>
      <ellipse cx="160" cy="256" rx="140" ry="12" fill="#3a2a63"/>
      <rect x="40" y="175" width="240" height="78" rx="10" fill="#e8527f"/>
      <rect x="70" y="125" width="180" height="56" rx="10" fill="#ff7fa9"/>
      <g id="drips" fill="#fff1f6"></g>
      <g fill="#ffc247" opacity=".9">
        <circle cx="75" cy="215" r="4"/><circle cx="115" cy="226" r="4"/><circle cx="160" cy="214" r="4"/>
        <circle cx="205" cy="226" r="4"/><circle cx="245" cy="215" r="4"/>
      </g>
      <g id="candles"></g>
    </svg>
  </div>

  <button class="btn" id="blow" type="button">انفخي الشموع</button>
  <p class="status" id="status" role="status"></p>

  <section class="wishes" aria-label="كروت التهنئة">
    <button class="wish" type="button" aria-pressed="false">
      <span class="tag">اضغطي عشان تفتحي</span>
      <span class="front">عن الشغل</span>
      <span class="back" hidden>الشغل من غيرك ملوش طعمة يا أستاذة مي. ربنا يخليكي لينا، وما يحرمناش من شقاكي وجدعنتك.</span>
    </button>
    <button class="wish" type="button" aria-pressed="false">
      <span class="tag">اضغطي عشان تفتحي</span>
      <span class="front">عن السنة الجاية</span>
      <span class="back" hidden>ربنا يجعلها أحلى سنة في عمرك، ويرزقك الصحة والستر والفرحة، ويبعد عنك أي هم أو وجع قلب، وتفضلي دايماً ضحكتك مالية الدنيا.</span>
    </button>
    <button class="wish" type="button" aria-pressed="false">
      <span class="tag">اضغطي عشان تفتحي</span>
      <span class="front">دعوة من القلب</span>
      <span class="back" hidden>ربنا يسعد قلبك ويفرحك على طول، ويحقق كل اللي نفسك فيه، وتفضلي دايماً ضحكتك مالية وشك.</span>
    </button>
  </section>
  <footer>من أخوكي الصغير، كل سنة وإنتي طيبة</footer>
</main>

<script src="script.js"></script>

</body>
</html>
